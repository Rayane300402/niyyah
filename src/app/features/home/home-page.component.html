<section class="home-page">
    <app-page-header
    title="السلام عليكم"
    subtitle="Friday, March 15, 2026"
    secondarySubtitle="28 Dhu'l-Qi'dah 1447" />

    <section class="fasting-status-section center">
        <div class="fasting-control-group center">
            <app-current-time />
            <app-fasting-action 
             [isFasting]="isFastingUi"
        (isFastingChange)="isFastingUi = $event" />
        </div>

        @if (prayerTimes){
            <app-maghrib-countdown [fajrTime]="prayerTimes.fajr" [maghribTime]="prayerTimes.maghrib" />
        }
    </section>
    <section class="fasting-text-section center">
        <app-fasting-status [isFasting]='isFastingUi' />
    </section>
</section>
