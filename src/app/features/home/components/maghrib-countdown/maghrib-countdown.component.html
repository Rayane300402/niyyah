<div class="maghrib-countdown">

  <svg
    class="countdown-ring"
    viewBox="0 0 280 280"
  >
    <circle
      class="ring-track"
      cx="140"
      cy="140"
      r="120"
    />

    <circle
      #progressCircle
      class="ring-progress"
      cx="140"
      cy="140"
      r="120"
    />
  </svg>

  <div class="countdown-content">
    <span class="countdown-time">
      {{ remainingTime }}
    </span>

    <span class="countdown-label">
      until Maghrib
    </span>
  </div>

</div>
